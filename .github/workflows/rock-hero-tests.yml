name: Rock Hero regression tests
on:
  pull_request:
    paths: ['rock-hero/**', '.github/workflows/rock-hero-tests.yml']
  push:
    branches: [main]
    paths: ['rock-hero/**', '.github/workflows/rock-hero-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rock-hero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rock-hero/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
