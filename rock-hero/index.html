<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rock Hero</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤘</text></svg>">
    
    <!-- Google Fonts - Rock Salt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none; /* Previne gestos do navegador */
        }
        
        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
        }
        
        /* Preload da fonte Rock Salt - força carregamento antes do jogo */
        .font-preload {
            font-family: "Rock Salt", cursive;
            position: absolute;
            left: -9999px;
            visibility: hidden;
        }
        
        #game-container {
            width: 100%;
            height: 100%;
        }
        
        /* Estiliza o canvas do jogo */
        #game-container canvas {
            display: block;
            /* Borda decorativa opcional */
            /* box-shadow: 0 0 30px rgba(233, 69, 96, 0.3); */
        }

        /* === CONTROLES MOBILE === */
        #mobile-controls {
            display: none; /* Escondido por padrão, JS mostra em dispositivos touch */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Container não bloqueia eventos */
            z-index: 1000;
        }

        .mobile-btn {
            position: absolute;
            pointer-events: auto; /* Botões capturam eventos */
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s, transform 0.1s;
        }

        .mobile-btn:active,
        .mobile-btn.active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.95);
        }

        .mobile-btn svg {
            width: 50%;
            height: 50%;
            fill: rgba(255, 255, 255, 0.7);
        }

        /* D-Pad (esquerda) - retângulo arredondado dividido ao meio */
        #dpad-container {
            position: absolute;
            bottom: 30px;
            left: 20px;
            display: flex;
            height: 80px;
            border-radius: 18px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        #btn-left, #btn-right {
            position: relative; /* sobrescreve o absolute do .mobile-btn */
            width: 67.5px; /* 45% cada lado */
            height: 100%;
            border-radius: 0;
            border: none;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Zona morta central (~10% da largura total) */
        #dpad-deadzone {
            width: 15px; /* 10% de 150px */
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }

        #btn-left.active, #btn-right.active {
            background: rgba(255, 255, 255, 0.35);
            transform: none;
        }

        /* Botão O - confirmar/pular (direita, embaixo) */
        #btn-jump {
            bottom: 30px;
            right: 20px;
            width: 90px;
            height: 90px;
            font-size: 28px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.7);
            font-family: sans-serif;
        }

        /* Botão X - voltar/ESC (direita, acima do O) */
        #btn-back {
            bottom: 140px;
            right: 30px;
            width: 60px;
            height: 60px;
            font-size: 22px;
            font-weight: bold;
            color: rgba(255, 100, 100, 0.7);
            font-family: sans-serif;
        }

        /* Ajustes para telas muito pequenas */
        @media (max-width: 480px) {
            #dpad-container {
                height: 60px;
                border-radius: 14px;
            }
            #btn-left, #btn-right {
                width: 52px;
            }
            #dpad-deadzone {
                width: 12px;
            }
            #btn-jump {
                width: 70px;
                height: 70px;
                font-size: 22px;
            }
            #btn-back {
                bottom: 115px;
                right: 25px;
                width: 45px;
                height: 45px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Elemento oculto para forçar carregamento da fonte antes do jogo -->
    <div class="font-preload">Rock Hero</div>
    
    <div id="game-container"></div>

    <!-- Controles Mobile (HTML sobreposto ao canvas) -->
    <div id="mobile-controls">
        <!-- D-Pad: Esquerda e Direita -->
        <div id="dpad-container">
            <div id="btn-left" class="mobile-btn" data-control="left">
                <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
            </div>
            <div id="dpad-deadzone"></div>
            <div id="btn-right" class="mobile-btn" data-control="right">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>

        <!-- Botão O - confirmar/pular -->
        <div id="btn-jump" class="mobile-btn" data-control="jump">O</div>

        <!-- Botão X - voltar/ESC -->
        <div id="btn-back" class="mobile-btn" data-control="back">X</div>
    </div>
    
    <!-- Versão do jogo (source-of-truth único) -->
    <script>window.GAME_VERSION = '1.35';</script>

    <!-- Phaser 3 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    
    <!-- Game Scripts (ordem: core → dados → sons → constantes → managers → cenas → inicialização) -->
    <script>
        // Carrega scripts com cache-busting automático baseado na versão
        [
            // Core: módulos puros sem dependências (Fase 1 da refatoração de GameData)
            'js/core/GameConfig.js',
            // Variante WORLDS/LEVELS (DEV OPTIONS → Ordem Proposta)
            'js/core/GameConfig.mundos-proposta.js',
            'js/core/TimeFormatter.js',
            'js/core/MapDebug.js',
            'js/core/GameState.js',
            // Loaders: helpers Phaser que dependem de GameConfig (Fase 2)
            'js/loaders/SpriteLoader.js',
            // Data: persistência (localStorage) que depende de GameConfig (Fase 3)
            'js/data/SaveManager.js',
            // Data: preferências globais do jogador (música, ...)
            'js/data/Settings.js',
            // Data: feature flags runtime + overrides por fase (Fase 4)
            'js/data/FeatureFlags.js',
            // Data: progresso do jogador (Fase 5 — depende de SaveManager + GameConfig + MapDebug)
            'js/data/ProgressTracker.js',
            // Fachada (depende de core/*, loaders/* e data/*)
            'js/GameData.js',
            'js/SoundManager.js',
            'js/managers/MusicManager.js',
            'js/constants.js',
            'js/shaders/VerticalOscillationPipeline.js',
            'js/managers/PlayerController.js',
            'js/managers/EnemyManager.js',
            'js/managers/EffectsManager.js',
            'js/managers/HUDManager.js',
            'js/managers/PauseMenu.js',
            'js/managers/VictoryScreen.js',
            'js/managers/WindSystem.js',
            'js/scenes/MenuScene.js',
            'js/scenes/SlotSelectScene.js',
            'js/scenes/CutsceneScene.js',
            'js/scenes/WorldMapScene.js',
            'js/scenes/CharacterSelectScene.js',
            'js/scenes/GameScene.js',
            'js/scenes/WorldCompleteScene.js',
            'js/game.js'
        ].forEach(src => {
            document.write(`<script src="${src}?v=${window.GAME_VERSION}"><\/script>`);
        });
    </script>

    <!-- Mobile Controls Script -->
    <script>
        // Estado global dos controles virtuais (acessível pelo Phaser)
        window.virtualControls = {
            left: false,
            right: false,
            jump: false,
            jumpHeld: false,
            jumpJustPressed: false,
            back: false,
            backJustPressed: false
        };

        // Detecta dispositivo touch
        function isTouchDevice() {
            return (
                ('ontouchstart' in window) ||
                (navigator.maxTouchPoints > 0) ||
                window.location.search.includes('mobile=true')
            );
        }

        // Inicializa controles mobile
        function initMobileControls() {
            if (!isTouchDevice()) {
                console.log('Dispositivo não-touch. Use ?mobile=true na URL para forçar controles mobile.');
                return;
            }

            console.log('Dispositivo touch detectado. Ativando controles mobile...');
            
            const mobileControls = document.getElementById('mobile-controls');
            mobileControls.style.display = 'block';

            // Referências aos botões
            const buttons = {
                left: document.getElementById('btn-left'),
                right: document.getElementById('btn-right'),
                jump: document.getElementById('btn-jump'),
                back: document.getElementById('btn-back')
            };

            // Rastreamento de toques ativos por botão
            const activeTouches = new Map();

            // Função para ativar controle
            function activateControl(control, element) {
                if (control === 'jump') {
                    window.virtualControls.jump = true;
                    window.virtualControls.jumpHeld = true;
                    window.virtualControls.jumpJustPressed = true;
                } else if (control === 'back') {
                    window.virtualControls.back = true;
                    window.virtualControls.backJustPressed = true;
                } else {
                    window.virtualControls[control] = true;
                }
                element.classList.add('active');
            }

            // Função para desativar controle
            function deactivateControl(control, element) {
                if (control === 'jump') {
                    window.virtualControls.jump = false;
                    window.virtualControls.jumpHeld = false;
                } else if (control === 'back') {
                    window.virtualControls.back = false;
                } else {
                    window.virtualControls[control] = false;
                }
                element.classList.remove('active');
            }

            // Função para encontrar qual botão está sob um ponto de toque
            // Direcionais têm 20% de tolerância nas bordas externas (não na interna/deadzone)
            function getButtonAtPoint(x, y) {
                for (const [control, element] of Object.entries(buttons)) {
                    const rect = element.getBoundingClientRect();
                    
                    if (control === 'left' || control === 'right') {
                        const marginX = rect.width * 0.2;
                        const marginY = rect.height * 0.2;
                        // Tolerância apenas nas bordas externas (esq/cima/baixo para left, dir/cima/baixo para right)
                        const left = control === 'left' ? rect.left - marginX : rect.left;
                        const right = control === 'right' ? rect.right + marginX : rect.right;
                        const top = rect.top - marginY;
                        const bottom = rect.bottom + marginY;
                        if (x >= left && x <= right && y >= top && y <= bottom) {
                            return { control, element };
                        }
                    } else {
                        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                            return { control, element };
                        }
                    }
                }
                return null;
            }

            // Desativa o controle real rastreado para um toque (resolve slide entre botões)
            function releaseTouch(touchId) {
                const touchData = activeTouches.get(touchId);
                if (!touchData) return;
                
                const ctrl = touchData.control;
                const elem = touchData.element;
                activeTouches.delete(touchId);
                
                // Só desativa se não houver outro toque no mesmo controle
                if (ctrl && ctrl !== 'deadzone') {
                    let stillTouching = false;
                    activeTouches.forEach((data) => {
                        if (data.control === ctrl) stillTouching = true;
                    });
                    if (!stillTouching) {
                        deactivateControl(ctrl, elem);
                    }
                }
            }

            // Configura eventos para cada botão
            Object.entries(buttons).forEach(([control, element]) => {
                // Touch Start
                element.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    for (let touch of e.changedTouches) {
                        activeTouches.set(touch.identifier, { control, element });
                    }
                    activateControl(control, element);
                }, { passive: false });

                // Também suporta mouse (para testes em desktop com ?mobile=true)
                element.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    activateControl(control, element);
                });

                element.addEventListener('mouseup', (e) => {
                    e.preventDefault();
                    deactivateControl(control, element);
                });

                element.addEventListener('mouseleave', (e) => {
                    deactivateControl(control, element);
                });
            });

            // Touch End/Cancel global - desativa o controle REAL do toque (não o do elemento original)
            document.addEventListener('touchend', (e) => {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    releaseTouch(touch.identifier);
                }
            }, { passive: false });

            document.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    releaseTouch(touch.identifier);
                }
            }, { passive: false });

            // Touch Move global - permite deslizar entre botões direcionais
            // Usa getButtonAtPoint (bounding rects) ao invés de elementFromPoint
            // pois pointer-events:none no container impede elementFromPoint de funcionar
            document.addEventListener('touchmove', (e) => {
                for (let touch of e.touches) {
                    const touchData = activeTouches.get(touch.identifier);
                    if (!touchData) continue;

                    // Verifica via bounding rect qual botão está sob o dedo
                    const hit = getButtonAtPoint(touch.clientX, touch.clientY);
                    const newControl = hit?.control;
                    
                    const isDirectional = (ctrl) => ctrl === 'left' || ctrl === 'right';
                    const wasDirectional = isDirectional(touchData.control) || touchData.control === 'deadzone';

                    if (newControl && newControl !== touchData.control) {
                        // Deslizou para um botão diferente
                        if (wasDirectional && isDirectional(newControl)) {
                            // Desativa o botão anterior (se não estava na deadzone)
                            if (touchData.control !== 'deadzone') {
                                deactivateControl(touchData.control, touchData.element);
                            }
                            // Ativa o novo botão
                            activateControl(newControl, hit.element);
                            activeTouches.set(touch.identifier, { control: newControl, element: hit.element });
                        }
                    } else if (!newControl && wasDirectional) {
                        // Entrou na deadzone ou saiu dos botões - desativa mas mantém rastreamento
                        if (touchData.control !== 'deadzone') {
                            deactivateControl(touchData.control, touchData.element);
                            // Marca como "na deadzone" para continuar rastreando
                            activeTouches.set(touch.identifier, { control: 'deadzone', element: null });
                        }
                    }
                }

                // Previne scroll durante toque nos controles
                e.preventDefault();
            }, { passive: false });
        }

        // Inicializa quando a página carregar
        window.addEventListener('DOMContentLoaded', initMobileControls);
    </script>
</body>
</html>
